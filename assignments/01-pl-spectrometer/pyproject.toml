[project]
name = "pl-spectrometer-simulator"
version = "0.1.0"
description = "Photoluminescence (PL) spectrometer simulator: xenon lamp excitation, dye sample database, monochromator detection."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# the package sits at the repository root, so pytest must look there
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "pypdf>=5"]
