[project]
name = "dls-simulator"
version = "0.1.0"
description = "Dynamic Light Scattering (DLS) nanoparticle sizing simulator: solvent viscosity/RI models, Rayleigh-Gans-Debye optical weighting, aggregation, autocorrelation g2(tau), and ISO 22412 cumulant PDI analysis."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",
    "pypdf>=5",
]
